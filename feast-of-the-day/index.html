<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feast of the Day | Christ the King Church</title><link rel="stylesheet" href="../style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--feast-ink:#34291f;--feast-muted:#766b5e;--feast-red:#8b1711;--feast-gold:#b28a42}
body{font-family:'Source Sans 3',sans-serif;color:var(--feast-ink);font-size:17px;line-height:1.8;background-color:#f4efe5;background-image:radial-gradient(ellipse at 8% 8%,rgba(194,153,77,.15),transparent 34%),radial-gradient(ellipse at 94% 28%,rgba(139,23,17,.075),transparent 36%),repeating-linear-gradient(0deg,rgba(102,77,43,.014) 0,rgba(102,77,43,.014) 1px,transparent 1px,transparent 5px),linear-gradient(135deg,#fbf8f1,#eee6d8 55%,#faf7f0);background-attachment:fixed}
.feast-page{max-width:1120px;margin:48px auto;padding:0 24px 76px}
.feast-back{display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;color:var(--feast-red);font-weight:600;text-decoration:none;font-size:1rem}
.feast-back:hover{text-decoration:underline}
.feast-head{position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(255,255,255,.97),rgba(250,245,235,.96));border:1px solid rgba(151,119,69,.23);border-top:5px solid var(--feast-red);border-radius:14px;padding:38px 42px;box-shadow:0 16px 42px rgba(58,43,26,.09)}
.feast-head:after{content:"✠";position:absolute;right:35px;bottom:-45px;font-family:'Cinzel',serif;font-size:190px;color:rgba(157,119,54,.055);pointer-events:none}
.feast-date{position:relative;z-index:1;color:var(--feast-red);text-transform:uppercase;letter-spacing:.13em;font-weight:700;font-size:.92rem;margin:0 0 8px}
.feast-page h1,.feast-page h2{font-family:'Cinzel',serif;color:var(--feast-ink)}
.feast-page h1{position:relative;z-index:1;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.25;margin:0 0 10px}
.feast-meta{position:relative;z-index:1;color:var(--feast-muted);font-size:1.04rem;margin:0 0 5px}
#feast-summary{position:relative;z-index:1;font-size:1.12rem;color:#494239;margin:0}
.feast-status{color:var(--feast-muted);margin:20px 4px 12px;font-size:.98rem}
.lang-tabs{display:flex;gap:10px;margin:20px 0 16px}
.lang-tabs button{font-family:'Source Sans 3',sans-serif;font-size:1rem;border:1px solid rgba(151,119,69,.35);background:rgba(255,255,255,.8);color:var(--feast-ink);border-radius:7px;padding:10px 22px;font-weight:700;cursor:pointer;transition:.2s}
.lang-tabs button.active,.lang-tabs button:hover{background:#382b20;color:#fff;border-color:#382b20}
.language-panel[hidden]{display:none}
.language-panel{background:rgba(255,255,255,.88);border:1px solid rgba(151,119,69,.2);border-radius:13px;padding:25px 30px;box-shadow:0 12px 32px rgba(58,43,26,.065)}
.proper-item{border-left:3px solid var(--feast-gold);background:linear-gradient(110deg,#fcfaf6,#fff);border-radius:0 9px 9px 0;padding:19px 24px;margin:0 0 17px;box-shadow:0 3px 12px rgba(58,43,26,.035)}
.proper-item:last-child{margin-bottom:0}
.proper-item h3{font-family:'Cinzel',serif;color:var(--feast-red);font-size:1.08rem;letter-spacing:.025em;margin:0 0 9px}
.proper-item p{font-family:'Source Sans 3',sans-serif;font-size:1.08rem;line-height:1.9;color:#39352f;margin:7px 0}
.proper-item .ref{color:var(--feast-muted);font-style:italic}
.proper-note{font-size:.88rem;color:var(--feast-muted);margin:15px 4px}
@media(max-width:650px){body{background-attachment:scroll}.feast-page{margin:24px auto;padding:0 14px 48px}.feast-head{padding:25px 22px}.feast-head:after{font-size:125px;right:8px}.language-panel{padding:16px}.proper-item{padding:15px 17px}.proper-item p{font-size:1rem}}
</style></head><body><main class="feast-page"><a class="feast-back" href="../index.html">← Christ the King Church</a><header class="feast-head"><p class="feast-date" id="feast-date">TODAY</p><h1 id="feast-title">Feast of the Day</h1><p class="feast-meta" id="feast-meta">Roman Missal of 1962 · Universal Ordo</p><p id="feast-summary">Loading today’s Mass Propers…</p></header><p id="feast-status" class="feast-status" aria-live="polite"></p><div class="lang-tabs" role="tablist" aria-label="Language"><button type="button" class="active" data-lang="en">English</button><button type="button" data-lang="la">Latin</button></div><section id="texts-en" class="language-panel"></section><section id="texts-la" class="language-panel" hidden></section><p class="proper-note">Texts are supplied by the Ordo 1962 calendar. Where a translation is unavailable, that language is identified as unavailable.</p></main><script src="feast.js" defer></script></body></html>
